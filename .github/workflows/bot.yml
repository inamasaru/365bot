name: 365bot

on:
  schedule:
    # 毎時10分間隔で実行
    - cron: '*/10 * * * *'
  workflow_dispatch:
    # 手動実行を許可
    inputs: {}

jobs:
  run-bot:
    runs-on: ubuntu-latest
    concurrency:
      group: 365bot-${{ github.ref }}
      cancel-in-progress: true
    env:
      KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
      PRODUCT_CATALOG: ${{ secrets.PRODUCT_CATALOG }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate required env
        run: |
          set -euo pipefail
          missing=()
          for key in KEEPA_API_KEY PRODUCT_CATALOG NOTIFY_WEBHOOK_URL; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "❌ Missing required secrets: ${missing[*]}"
            exit 2
          fi
      - name: Install dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python sources
        run: |
          set -euxo pipefail
          python -m compileall -q .
      - name: Run bot script
        run: |
          set -euxo pipefail
          python main.py
