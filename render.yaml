services:
  - type: cron
    name: keepa-profit-bot
    env: python
    plan: free
    schedule: "*/30 * * * *"  # 30分ごとにチェック（Render 無料枠想定）
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    envVars:
      - key: KEEPA_API_KEY
        sync: false
      - key: PRODUCT_CATALOG
        sync: false
      - key: NOTIFY_WEBHOOK_URL
        sync: false
      - key: PROFIT_FEE_RATE
        value: "0.15"
      - key: PROFIT_FBA_FEE
        value: "440"
      - key: RETRY_COUNT
        value: "3"
      - key: RETRY_BACKOFF_SECONDS
        value: "1"
      - key: RATE_LIMIT_INTERVAL
        value: "1.0"
      - key: REQUEST_TIMEOUT
        value: "15"
      - key: WEBHOOK_RETRIES
        value: "3"
      - key: LOG_LEVEL
        value: "INFO"
      - key: DRY_RUN
        value: "false"
